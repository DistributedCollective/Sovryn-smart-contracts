# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
          persist-credentials: false

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Cache Hardhat compilers
        uses: actions/cache@v4
        env:
          cache-name: cache-hardhat-compilers
        with:
          # Solidity compiler binaries downloaded by Hardhat are stored here. Restoring
          # them from cache avoids re-triggering Hardhat's compiler download logic, which
          # is prone to a known race condition when it does run
          # (https://github.com/NomicFoundation/hardhat/issues/8569).
          path: ~/.cache/hardhat-nodejs/compilers-v2
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ hashFiles('hardhat.config.js') }}

      - name: Installing Packages
        run: npm ci --parallel=1
      - name: Checking Formatting
        run: npm run lint &&  npm run prettier && npm run prettier-check
      - name: Fix Hardhat compiler binary permissions
        run: |
          if [ -d "$HOME/.cache/hardhat-nodejs/compilers-v2/linux-amd64" ]; then
            chmod +x "$HOME"/.cache/hardhat-nodejs/compilers-v2/linux-amd64/solc-linux-amd64-v* || true
          fi
      - name: Running Test
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          HARDHAT_USE_SOLCJS: "true"
        run: |
          set +e
          npm run test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -qE "spawn .*solc-linux-amd64.* EACCES" test-output.log; then
            # Hardhat has a known race condition where concurrent compilation jobs can
            # observe a partially downloaded/un-chmod'ed compiler binary as "ready"
            # (https://github.com/NomicFoundation/hardhat/issues/8569). Clear the
            # affected compiler cache and retry once.
            echo "Detected known Hardhat compiler-download race condition. Clearing compiler cache and retrying..."
            rm -rf "$HOME/.cache/hardhat-nodejs/compilers-v2"
            npm run test
          else
            exit "$status"
          fi
      # - name: Increasing the memory
      #   run: export NODE_OPTIONS="--max-old-space-size=7168"
