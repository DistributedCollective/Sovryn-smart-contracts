name: Extend Staking

on:
  schedule:
    # The cron job should run every four weeks from the creation of four year vesting contract
    # and only for 52 weeks
    - cron: "30 10 * * FRI"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Setup node.js
        uses: actions/setup-node@v1
        with:
          node-version: "14.x"
      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Cache compiler installations
        uses: actions/cache@v4
        with:
          path: |
            ~/.solcx
            ~/.vvm
          key: ${{ runner.os }}-compiler-cache

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"

      - name: Install python dependencies
        run: pip install -r requirements.txt && brownie pm install OpenZeppelin/openzeppelin-contracts@4.9.5

      - name: Pre-install Solidity compilers from GitHub
        run: |
          # Clean up any corrupted cache entries and ensure proper directory structure
          rm -rf ~/.solcx/solc-v0.5.17 ~/.solcx/solc-v0.8.17
          mkdir -p ~/.solcx/solc-v0.5.17 ~/.solcx/solc-v0.8.17
          
          # Download compilers from GitHub releases
          curl -L -o ~/.solcx/solc-v0.5.17/solc-v0.5.17 https://github.com/ethereum/solidity/releases/download/v0.5.17/solc-static-linux
          curl -L -o ~/.solcx/solc-v0.8.17/solc-v0.8.17 https://github.com/ethereum/solidity/releases/download/v0.8.17/solc-static-linux
          
          # Make them executable
          chmod +x ~/.solcx/solc-v0.5.17/solc-v0.5.17 ~/.solcx/solc-v0.8.17/solc-v0.8.17

      - name: Extend Staking
        run: echo $REWARDS_CRON && brownie networks import network-config.yaml true && brownie run scripts/fouryearvesting/extendStakingCron.py --network=rsk-mainnet
        env:
          REWARDS_CRON: 1
          FEE_CLAIMER: ${{secrets.FEE_CLAIMER}}
