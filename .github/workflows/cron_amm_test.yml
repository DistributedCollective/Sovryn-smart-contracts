# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Fees Scheduler AMM pip Test

on:
  schedule:
    - cron: "0 0 * * THU"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      # - name: Set pip cache directory path
      # id: pip-cache-dir-path
      # run: |
      #   echo "::set-output name=dir::$(pip cache dir)"

      # - name: Restore pip cache
      #   uses: actions/cache@v2
      #   id: pip-cache
      #   with:
      #     path: |
      #       ${{ steps.pip-cache-dir-path.outputs.dir }}
      #     key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      #     restore-keys: |
      #       ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      #       ${{ runner.os }}-pip-

      - name: Install python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install PyYAML==5.4.1  # Install PyYAML first
          pip install -r requirements.txt && brownie pm install OpenZeppelin/openzeppelin-contracts@4.9.5

      - name: Withdraw Fees
        run: echo $REWARDS_CRON && brownie networks import network-config.yaml true && brownie run scripts/contractInteraction/rewards_cron_amm.py --network=rsk-mainnet
        env:
          REWARDS_CRON: 1
          FEE_CLAIMER: ${{secrets.FEE_CLAIMER}}
