# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Fees Scheduler AMM

on:
  schedule:
    - cron: "0 0 * * THU"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Save current directory
        run: echo "CURRENT_DIR=$(pwd)" >> $GITHUB_ENV
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.9"
      - name: Restore correct directory
        run: cd ${{ env.CURRENT_DIR }}
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.9" # or another version compatible with your package
      # - name: Check Python version
      #   run: python --version # Verify the Python version
      # - name: Print working directory
      #   run: pwd # Print the current working directory
      # - name: List files
      #   run: ls -la
      - name: Install python dependencies
        run: pip install -r requirements.txt && brownie pm install OpenZeppelin/openzeppelin-contracts@4.9.5
      - name: Withdraw Fees
        run: echo $REWARDS_CRON && brownie networks import network-config.yaml true && brownie run scripts/contractInteraction/rewards_cron_amm.py --network=rsk-mainnet
        env:
          REWARDS_CRON: 1
          FEE_CLAIMER: ${{secrets.FEE_CLAIMER}}
